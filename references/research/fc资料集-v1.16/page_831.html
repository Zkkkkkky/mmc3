pic_ext="jpeg"><BR><BR><BR>击落沙鲁后，高飞驾驶布欧（布欧三次攻击）复活，带三个分身。故技重施，击落两个分身后，换机体拖住分身，超三、加血机配合正树牵引击落布欧。然后无限刷布欧，除莎也加外全部刷至满级。<BR>建议优先升级多蒙师徒，然后超三，再其他人。超三和多蒙师徒满级后，站好位置磨血，避开布欧的电波防御的话，8个回合左右刚好可以磨到104HP，然后就可以顺利拿到多次经验了….（东方不败满级要用一个磁性涂料才不会被布欧双击；除</FONT><A
