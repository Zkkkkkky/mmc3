<P><FONT size=2>&nbsp;&nbsp;&nbsp;<FONT face=宋体> 
如在使用过程中遇到闪退的问题，一般而言是由于误将模拟器的声音设置更改为静音（此为当前主流版本的BUG），此时需要卸载原先的模拟器，然后重新下载安装即可，切记请勿在模拟器中将声音设置为静音。</FONT></FONT></P></BODY></HTML>
