<P><STRONG><FONT size=2>1.玩家水平情况介绍</FONT></STRONG></P>
<P><FONT 
size=2>此类玩家能顺利地通关一些初级的改版，此时也建立了玩改版的基础和信心，最为重要的是能突破自己，将改版中的难点攻克。</FONT></P>
<P><STRONG><FONT size=2>2.如何进阶到下一级别</FONT></STRONG></P><FONT size=2>
<P><FONT 
size=2>在接触了比较容易的一类改版之后，可以尝试一些改动较大的改版，因为初期改版对于整体的改动较小，只是属性、配置上的变化，事件基本是不变的，可以完全遵循原版的套路去打。也就是说由于改版本身的性质，攻略过程中的思路完全是按照固有的模式进行的，只是在细节方面略有调整。此时可以尝试一些游戏模式略有改动的版本，以形成对“事件”的基本认知。</FONT>一般推荐为BOBO8，梦想飞离，蓝月1。</FONT></P></BODY></HTML>
