size=2>第11关：本关依旧分为两个阶段<BR>第一阶段：只有阿斯兰驾驶正义，逃跑。地点在左下角。其实等到第3回合结束<BR>就好，他自己就会飞过去。可以利用他的精神先消耗小兵点血。注意千万别三个<BR>急风跑到那个点上，不然因为剧情移动。会离开那个位置，BOSS过来攻击不到造<BR>成死机。<BR>第二阶段：BOSS消失我方人员出现。先规矩的灭小兵。泽奥拉带俩小兵出来后，<BR>听大神的话，别杀她，不然......别问我。<BR>25回合樱花带俩强化儿童出现，刷刷刷一堆剧情，挂了一个，她们就走了。全灭<BR>过关吧。<BR>本关有一个疑问，如果第6关不劝降泽奥拉，不知道樱花出来还有剧情没。是不是<BR>要面对三个BOSS？有兴趣的完家可以尝试一下<IMG
