<BODY><FONT size=2>HP 回复的途径主要有以下几种：精神、修理装置、回血站、主舰搭载、道具。<BR>1）精神回复：HP 
回复精神有毅力、潜力、友情、情义、援助、祈祷、爱心。精神消耗量和效果视版本不同可能有所变动。原版回复性精神回复HP值请参考<FONT 
color=#ff0000>游戏说明-游戏简介-参数说明-显参-精神<BR></FONT>2）修理装置回复：若机体带有修理装置，则可以给自身或队友回复 
Hp，回复量为修理机自身 HP 的一半。<BR>3）回血站回复：机体站在回血站上时，每回合回复 
30%HP，敌方行动阶段结束后生效。<BR>4）主舰搭载回复：我方机体搭载在主舰中时，每回合回复 
30%HP，敌方行动结束后生效。<BR>5）道具回复：有些道具可以回复 HP，例如维修，一般不使用。</FONT> </BODY></HTML>
