<P><FONT 
size=2>机体的机动性，也就是机体在地图上一次能移动几格，根据机体的类型和地形的不同，机体移动一次的距离也会有所不同。机体在不同地形上移动一格消耗的机动数请参照<FONT 
color=#ff0000>游戏说明-游戏简介-参数说明-隐参-地形影响。</FONT></FONT><FONT 
size=2>机体的机动性可以通过使用精神（加速、疾风）或者道具（疾风）得到暂时的强化，也可以通过使用道具“助推器”（助推器原版没有出现，一些改版中有）得到永久加强。 
</FONT></P></BODY></HTML>
