<P><FONT 
size=2>第15关：一开始只有小艾一人，一定要站加血基地上，只能靠SL了。灭掉两个原生种后我方<BR>增援出现。有两条路可走，跟八关一样，大神还是建议你走上路，不然小艾有危险。<BR>8回合小妹妹开始行动。11回合结束小妹妹跟小艾剧情离开。有能力杀，没能力就<BR>后撤。<BR>走上路主要是吸引敌人，不让他们靠近小艾。<BR>小妹妹离开后英子带领2个强化儿童出现，注意2个强化儿童本关2次行动，全军后<BR>撤，利用狭窄地形卡住他俩杀。别的不难，注意有个33J小怪，分配好经验。</FONT></P>
