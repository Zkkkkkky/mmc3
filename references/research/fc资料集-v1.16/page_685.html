<P><FONT 
size=2>第6关：<BR>上来就放妮娜去单挑上边四个远程，反击杀，命中不高的，这个很重要。母舰负责她的血。<BR>热血啥的上来就招呼卡尔，直到劝降，越快后边的压力越小。<BR>劝降后上边4个远程基本差不多了，第5回合敌增援出来后游击，往水里去，主要是俩比纳还有刚毅烦人。边打边退，比纳刚毅跟不上，空的先灭。到最上边平原时差不多了，阵地战杀。过关。</FONT></P>
