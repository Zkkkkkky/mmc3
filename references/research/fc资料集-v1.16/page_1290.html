<BODY>
<P><FONT 
size=2>超任模拟器无法保存游戏存档，即无法通过在战场地图上使用“存储”命令来存档，关卡存档（关卡结束后存档）亦不可行，需要通过模拟器的即时存档和读档来保存和读取游戏进度，方法如下：</FONT></P>
<P><FONT 
size=2><STRONG>1.通过手机菜单键调出工具栏。选择“保存”再选择相应的插槽即可保存当前进度</STRONG></FONT></P>
<P><FONT size=2><STRONG><IMG src="存档设置1.png" width=409 
height=249></STRONG></FONT></P>
<P><FONT 
size=2><STRONG>2.模拟器一共设有10个插槽，一个快捷插槽，在游戏打开后会自动载入该进度，另外9个为普通插槽，可以通过“读取”来读取保存的进度</STRONG></FONT></P>
<P><FONT size=2><STRONG><IMG src="存档设置2.png" width=409 
height=284></STRONG></FONT></P></BODY></HTML>
