size=2>第十六关<BR>本关多蒙速度要大于130（正常情况下多蒙作为主力这关怎么也得有150+的速度…），否则开场多蒙爆机的话，换机时东方不败会代替多蒙爆机，然后就没什么然后了…..阿克塞尔爆机就爆机吧，不要强迫症…亚克托火力挺高，不过不是很耐打，不要吝惜精神，该秒秒。老虎的挑战让多蒙和阿姆罗配合一台加血机去就可以了。（35级的瓦尔可以拿到两次经验，看着来…）拿老虎的两次经验的话，多蒙双击杂兵，打一个残一个…<BR>地图中间的上方的亚克托附近那个深颜色的位置是个隐藏商店，里面有热血和米诺夫粒子卖，过这村没这店…<BR>最后多蒙主动击落东方不败触发剧情，注意那几个要点。（过关时看看有没有那句“……！！”）<BR><IMG
