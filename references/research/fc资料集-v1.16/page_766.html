<BODY>
<P><STRONG><FONT 
size=2>所谓即时事件，就是在本关中任意时刻，只要达成相应的事件触发条件，就会执行的事件。其中勝利条件必须具有（达成过关条件的条件，否则无法结束本关卡），失败条件可以省略（一般而言是我方全灭），但是会导致一个问题-我方全灭后只能进行回合结束，无法进行其他任何操作，所以建议每关都设定失败条件。</FONT></STRONG></P></BODY></HTML>
