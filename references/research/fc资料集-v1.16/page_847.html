<BODY><FONT 
size=2>FC第二次机器人大战VROM的大小为256KB，我们将其分割为256个图库，每个图库大小为1KB，即256*256像素的矩形。部分图库被系统设定在了固定的位置，原则上是不可以随意变动的，当然你也可以修改程序进行变更，但是这是完全没有必要的，因为仅仅是位置上的变更不会对其他任何东西造成影响，或许只是空间布局上条理更清晰，这也只是个人的主观意愿，所以对于这部分图库按照游戏原有的设定位置去调整即可。</FONT></BODY></HTML>
