<BODY><PRE><PRE>                <FONT size=2 face=微软雅黑> 机体拼图</FONT></PRE><PRE><FONT size=2 face=微软雅黑>01.起始以F3+AA+BB：F3规定图片坐标；AA为X轴坐标；
BB为Y轴坐标。
02.FD 20+AA:FD 20规定规则取图方式；AA
为取图宽度。
03.F9+AA+BB:F9规定取图块数量和地址；AA为取图数量；
BB为取图开始地址（机体图片代码的tile号）。
04.F3+AA+BB+CC+DD:F3规定图片坐标；AA为X轴坐标；
BB为Y轴坐标;CC取图开始地址；DD取图结束地址。
05.FF:结束取图</FONT></PRE>
