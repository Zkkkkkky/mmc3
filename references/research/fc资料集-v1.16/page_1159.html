<BODY>
<P><FONT size=2>机体的类型分为<FONT 
color=#0000ff>海、陆、空</FONT>三种。机体的类型会影响机体在移动时的范围（即海、陆单位会受到地形机动补正的影响）和攻击时的最终命中（地形命中补正），以及被攻击时受到的伤害（具体影响下面会提到），在一些改版中（钢铁之魂、时空之影）还会影响所承受的伤害（地形防御补正【补正系数等同于地形命中补正】）。机体类型为自身属性，通常情况下是不能变的，但有一种特殊情况，就是陆、海类型机体可以通过使用道具喷气机翼使机体类型变为空，这种情况原版是没有的，在一些改版中可能出现。</FONT> 
</P></BODY></HTML>
