<BODY><FONT 
size=2>BOBO8有两个版本，一个是最初发布版本，另一个是修复版本。<BR>BOBO8修复版更新内容：<BR>1、米亚原本驾驶的（伯利）更改为（破坏神），武器也有所更换；<BR>2、米亚驾驶的（瓦尔）增加特殊技能（减30%命中）；<BR>3、米亚驾驶的（破坏神）增加特殊技能（盾防御）；<BR>4、巴斯塔原本空形为（巴德）更改为（白骑士），最后阶段的机体增加一个武器；<BR>5、敌方增加一个希奥尼机体外加2个人物；<BR>6、部分机体颜色更改；<BR>7、修改部分关卡地图，配置，难度有所调整；<BR>8、最后一关敌人行动回合数有所增加，不会再一开始就一大波下来；<BR>9、修复了部分BUG，错误文字等；</FONT></BODY></HTML>
