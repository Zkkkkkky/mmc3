<BODY><FONT 
size=2>超任模拟器的设置比较简单，一共就那么几个选项，只简单地提一下设置相关的内容。<BR>（1）音频&amp;视频设置<BR>·不要取消勾选开启声音选项，否则下次打开模拟器会黑屏，不想要声音的话把音量调到最小就可以了。<BR>·加速设置在音频&amp;视频设置里可以找到，0.5~8倍速。<BR>（2）输入设置<BR>·取消振动设置：输入设置→虚拟键盘设置→取消键盘振动选项<BR>·连发键设置：输入设置→虚拟键盘设置→隐藏虚拟按键→取消禁用Turbo 
A/B键选项<BR>（3）其它设置<BR>·主要是屏幕方向设置。</FONT> </BODY></HTML>
