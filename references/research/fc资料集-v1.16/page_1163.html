<P><FONT 
size=2>强度、防御这两项影响攻击时伤害值。其中强度关系到武器的火力，武器火力=武器基础伤害+强度；防卫值关系到机体的防御能力。具体关系如下：攻击伤害=攻击方武器火力-被攻击方防卫；</FONT><FONT 
size=2>最终伤害计算公式请参考<FONT color=#ff0000>游戏说明-游戏简介-参数说明-隐参-AI智商</FONT><FONT 
color=#000000>中的公式说明；</FONT></FONT><FONT 
size=2>伤害会受到特殊技能（防御系统、盾）和精神（强攻、热血）的影响，在一些改版中还会受到地形防御补正的影响，关于这些影响因素请参考<FONT 
color=#ff0000>游戏说明-游戏简介-参数说明-隐参-AI智商、地形影响。<FONT 
color=#000000>强度、防御的提升主要通过升级得以实现，另外机体的更换和道具使用的加成也会相应的提升强度和防御。</FONT><BR></FONT></FONT></P></BODY></HTML>
