<P><FONT 
size=2>机体速度关系到两个方面。首先，机体速度值影响攻击时的命中率及被攻击时的回避几率（即速度影响双方的命中的补正，正向和逆向补正），具体影响下面会提到。此外，速度的另一个影响就是能否双击的问题，当机体速度差达到一定数值（原版为 
50 
及以上）时，交战时就会出现“最后攻击”或“最后反击”的情况，这使得速度高的机体输出得以大大的提高，最常见的例子就是原版ν高达了，所以，在一般改版中队伍里速度高的机体经常能成为主力输出者。</FONT></P></BODY></HTML>
