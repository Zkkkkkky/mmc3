size=2>第19关：<BR>上来我方分开，左与上各5架。<BR>就说下隐藏1的问题：劝降雷切尔。<BR>是在灭了大BOSS后，把大武者HP降低到能被雷切尔1次杀死的情况下劝降被杀，过关得隐藏1。我认为是这样，反正我在大BOSS死前劝降N次都无用。<BR>还有要注意劝降时的位置，有时候雷切尔会走错位，要注意存档。</FONT>
