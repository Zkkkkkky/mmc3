size=2>第8关：<BR>上来一定要注意引假艾克赛林的位置，不然..我方增援一出来利加就会被灭掉。<BR>下来阵地战打，尽量先灭远程。<BR>第8回合下来两台AE，第10回合增援3个7格远程，13回合最后台AE行动。BOSS老规矩不动。<BR>AE都下来后适当放风筝，建议彩的干扰留住别用。<BR>杀完小兵打BOSS一下真艾克赛林与布西出现。这时候用干扰可以防止布西不死，不然BOSS双击的命。当然还有别的方法保他不死，不说了。</FONT>
