<P><FONT size=2>第三关需要sl的地方比较多，首先是我们寒酸的等级<BR><IMG 
style="WIDTH: 408px; HEIGHT: 221px" class=BDE_Image 
src="https://imgsa.baidu.com/forum/w%3D580/sign=dc178675c18065387beaa41ba7dda115/a493a364034f78f0b83299c872310a55b3191c49.jpg" 
width=560 height=315 size="74549" changedsize="true"></FONT></P>
<P><FONT 
size=2>第一回合，卡姆去反击中间的三个远程，加代反击3个小兵，然后龙变欧文加速然后变路易，第一回合就能打到海里面的一个，命中50%多，很尴尬，必须sl主动和反击全命中<BR><IMG 
style="WIDTH: 411px; HEIGHT: 231px" class=BDE_Image 
src="https://imgsa.baidu.com/forum/w%3D580/sign=588e39f8dcca7bcb7d7bc7278e086b3f/cd3bde88d43f87948e424815d91b0ef41ad53acd.jpg" 
width=560 height=315 size="190089" changedsize="true"></FONT></P>
<P><FONT 
size=2>第二回合盖塔继续和水里面的搞事，大卫和由美出来，卡姆则加速去反击巴勒，由于这回合的反击回合需要sl盖塔3全部反击中而且卡姆只能承受俩次攻击，所以和一个巴勒贴身少吃一次伤害<BR><IMG 
style="WIDTH: 413px; HEIGHT: 243px" class=BDE_Image 
src="https://imgsa.baidu.com/forum/w%3D580/sign=2de4438295510fb37819779fe933c893/538a39adcbef7609801f94a425dda3cc7cd99e77.jpg" 
width=560 height=315 size="196746" changedsize="true"></FONT></P>
<P><FONT size=2>之后第三回合，龙上岸打一个小兵，海里面的那个会被由美俩次打死，然后大卫劝降妮娜，给卡姆加和情义。<BR><IMG 
style="WIDTH: 413px; HEIGHT: 245px" class=BDE_Image 
src="https://imgsa.baidu.com/forum/w%3D580/sign=dd7faa53da09b3deebbfe460fcbf6cd3/0e432e9759ee3d6ddeca8af048166d224f4ade7f.jpg" 
width=560 height=315 size="195464" changedsize="true"></FONT></P>
<P><FONT size=2><BR><IMG style="WIDTH: 418px; HEIGHT: 233px" class=BDE_Image 
src="https://imgsa.baidu.com/forum/w%3D580/sign=630ebf9fafc27d1ea5263bcc2bd5adaf/65f9e150352ac65ca7096b48f0f2b21193138a7f.jpg" 
width=560 height=315 size="171347" changedsize="true"></FONT></P>
<P><FONT 
size=2>最后第四回合，盖塔2刚达和妮娜干掉凯，卡姆杀掉右边的巴勒，这关的要点是卡姆必须有疾风，也就是起码有个5级</FONT></P></BODY></HTML>
