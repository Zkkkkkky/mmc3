<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML><HEAD><TITLE>图像素材的处理</TITLE>
<META name=GENERATOR content="MSHTML 8.00.7601.19104">
<META content="text/html; charset=gb2312" http-equiv=Content-Type>
<STYLE>
html,body { 
	/* Default Font */
	font-family: Microsoft YaHei, Simsun, sans-serif;
	font-size: 12pt;
}
</STYLE>
</HEAD>
<BODY>
<P><FONT size=2>以下我用魔神Z为例，讲解处理过程的步骤</FONT></P>
<P><FONT size=2>1.用PS打开原图，点击放大，使得图像处于合适的操作视图大小</FONT></P>
<P><FONT size=2><IMG src="方大.png" width=889 height=492></FONT></P>
<P><FONT size=2>2.选择颜色表，准备对图像进行处理</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 892px; HEIGHT: 508px" src="颜色表.png" width=742 
height=466></FONT></P>
<P><FONT size=2>3.处理掉多余的杂色</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 883px; HEIGHT: 543px" src="处理后.png" width=902 
height=556></FONT></P>
<P><FONT size=2>4.将剩余需要的部分更改为6色</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 884px; HEIGHT: 547px" src="六色.png" width=995 
height=605></FONT></P>
<P><FONT size=2>5.点一下RGB颜色，再点一下索引颜色，然后打开颜色表</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 900px; HEIGHT: 505px" src="索引颜色.png" 
width=941 height=545></FONT></P>
<P><FONT size=2>6.这就是效果颜色，我们要将其更改为可以导入CT的颜色</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 904px; HEIGHT: 513px" src="效果颜色.png" 
width=984 height=591></FONT></P>
<P><FONT size=2>7.将机体主体颜色更改为白绿蓝三色</FONT></P>
<P><FONT size=2><IMG style="WIDTH: 898px; HEIGHT: 543px" src="绿蓝白.png" width=960 
height=579></FONT></P>
<P><FONT size=2>8.将主体图片另存为</FONT></P>
<P><FONT size=2><IMG src="存储为.png" width=915 height=586></FONT></P>
<P><FONT size=2>9.选择BMP格式，然后命名后保存</FONT></P>
<P><FONT size=2><IMG src="BMP.png"></FONT></P>
<P><FONT size=2>10.去除主体后，将机体碎片也更改为绿蓝白三色，然后另存为保存</FONT></P>
<P><FONT size=2><IMG src="碎片.png" width=928 height=599></FONT></P>
<P><FONT size=2><IMG src="碎片BMO.png"></FONT></P></BODY></HTML>
