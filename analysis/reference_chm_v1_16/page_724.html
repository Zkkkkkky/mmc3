size=2>第17关：关前语录：拉米亚等级不要小于31级。<BR>本关正常情况下，除了开始的2个救世主外，所有小兵与BOSS都双攻击。<BR>开始集体前进，先杀2个救世主。第4回合敌人集体进攻。看好位置，先灭1~~2个小兵<BR>然后就集体上母舰游击吧。由于地图较小别被包围了。上关成功收英子的话本关她<BR>是绝对主力，火力高血多防高速度也可以。敌人双攻击被反击掉血也很快的。基拉<BR>与英子主要火力，其它人配合就好。<BR>另外说下21J拉托尼在这关扫死BOSS除外所有小兵可升50，如果做到，后边某关会轻松<BR>很多。怎么做到，就看个人能力了。</FONT>
