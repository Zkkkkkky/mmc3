<STYLE>
html,body { 
	/* Default Font */
	font-family: Microsoft YaHei, Simsun, sans-serif;
	font-size: 12pt;
}
</STYLE>
</HEAD>
<BODY>
<P><FONT 
size=2>如果手机只有HOME键，没有菜单键和返回键，可先百度查找自己的手机是否可以设置虚拟按键，若有，可根据教程在手机系统中设置虚拟菜单键、返回键进行使用。如果手机没有设置虚拟按键的功能，可下载“<FONT 
color=#ff0000>悬浮菜单</FONT>”进行相应的虚拟按键的设置。</FONT></P></BODY></HTML>
