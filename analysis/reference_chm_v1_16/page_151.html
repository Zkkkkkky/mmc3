<P><FONT 
size=2><STRONG>1.故事线的设定：</STRONG>本次改版的目标是FC第二次机器人大战重置版，剧情参考PS版第二次机器人大战。为此我下载了PS模拟器和PS第二次机器人大战的汉化版ROM。PS第二次机器人大战比较简单，但是提取剧情的时候必须考虑到各个分支，因为网上没有PS第二次机器人大战的剧本，所有文字都必须自己手打（其他平台的一些机战在网上有完整的剧本，想移植的话可以直接下载，然后整理），移植绝大多数其他平台的机战这是必须要做的，剧本是一个比较大的工程。整个剧本我花了三天时间整理（这仅仅是剧本的初稿，后续还有很大的调整），大概为三十多个小时。</FONT></P>
