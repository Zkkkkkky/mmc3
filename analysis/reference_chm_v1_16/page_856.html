size=2>第二话。开始龙强攻往上走反击夏亚2小弟，其他人杀一个敌方加血机（存档龙必须反击命中夏亚2小弟）第2回合，主舰和龙强攻杀掉血多的小弟，其他人杀一个敌方加血机，多余人可以打夏亚就打夏亚，不能就干小兵，加血机的精神别用与一个援助留到敌方4boss增援在用，第3回合再收掉剩下的一个加血机和剩下的敌方远程小兵（也可以杀个1敌方加血机，其他人输出夏亚,SL躲掉敌方远程小兵攻击不死人），龙杀了剩下的小弟（给龙加友情吧）.第4回合直接收掉夏亚留一个小兵等增援，其他人回复即可，4boss攻击防御最低，站一下位小飞机抗两个其他人杀即可</FONT>
